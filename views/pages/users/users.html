<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios</title>
        <!-- Bootstrap -->
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">

    <!-- css -->
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/form.style.css">
    <link rel="stylesheet" href="/css/sidebar.style.css">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- ajuste importante para sticky navbar -->
    <style>
        .main-area {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
    </style>
</head>

<body>

<div class="layout">

    <!-- Sidebar -->
    <div id="sidebar-container"></div>
    <div class="main-area">
        <!-- NAVBAR (BOOTSTRAP STICKY) -->
        <nav class="navbar navbar-light bg-white border-bottom shadow-sm px-4 py-2 sticky-top">

            <div class="container-fluid">

                <!-- Título -->
                <span class="navbar-brand mb-0 h1 fs-5 fw-semibold text-dark">
                    Gestión de empleados
                </span>

            </div>
        </nav>
    <!-- CONTENIDO -->
        <main class="flex-grow-1 p-3">

            <div class="container-fluid">

                <!-- FILTROS -->
                <div class="card shadow-sm mb-3">
                    <div class="card-body">

                        <h5 class="card-title mb-3">Filtros de usuarios</h5>

                        <div class="d-flex flex-wrap gap-2">

                            <!-- Buscar -->
                            <input 
                                type="text" 
                                class="form-control"
                                id="searchInput"
                                placeholder="Buscar por nombre o DNI"
                                style="max-width: 220px;"
                            >

                            <!-- Estado -->
                            <select data-admin class="form-select" id="filterStatus" style="max-width: 160px;">
                                <option value="">Todos</option>
                                <option value="1">Activos</option>
                                <option value="0">Inactivos</option>
                            </select>

                            <!-- Área -->
                            <select class="form-select" id="filterArea" style="max-width: 180px;">
                                <option value="">Todas las áreas</option>
                            </select>

                            <!-- Categoría -->
                            <select class="form-select" id="filterCategory" style="max-width: 180px;">
                                <option value="">Todas las categorías</option>
                                <option value="employee">Trabajador</option>
                                <option value="intern">Practicante</option>  
                            </select>

                            <!-- Rol -->
                            <select data-admin class="form-select" id="filterRole" style="max-width: 160px;">
                                <option value="">Todos los roles</option>
                                <option value="admin">Admin</option>
                                <option value="user">Usuario</option>
                            </select>

                            <!-- Limpiar -->
                            <button class="btn btn-outline-secondary ms-auto" id="clearFilters">
                                Limpiar
                            </button>

                            <!-- Nuevo -->
                            <button class="btn btn-primary" id="newUserBtn" data-admin>
                                + Usuario
                            </button>

                        </div>

                    </div>
                </div>

                <!-- TABLA -->
                <div class="card shadow-sm">
                    <div class="card-body">

                        <div class="table-responsive">
                            <table class="table table-sm align-middle mb-0">

                                <thead class="table-light">
                                    <tr>
                                        <th colspan="10" 
                                            class="text-center fw-semibold fs-5">
                                            Lista de trabajadores
                                        </th>
                                    </tr>
                                    <tr>
                                        <th>Apellidos</th>
                                        <th>Nombres</th>
                                        <th>DNI</th>
                                        <th>Categoría</th>
                                        <th>Área</th>
                                        <th>Cód. Entrada</th>
                                        <th data-admin>Rol</th>
                                        <th data-admin>Estado</th>
                                        <th data-admin>Creado</th>
                                        <th data-admin></th>
                                    </tr>
                                </thead>

                                <tbody id="usersTableBody">
                                    <tr>
                                        <td colspan="10" class="text-center text-muted py-4">
                                            Cargando...
                                        </td>
                                    </tr>
                                </tbody>

                            </table>
                            <div class="d-flex justify-content-end gap-2 mt-3">
                                <button
                                    id="prevBtn"
                                    class="btn btn-outline-primary btn-sm"
                                >← Anterior</button>

                                <button
                                    id="nextBtn"
                                    class="btn btn-outline-primary btn-sm"
                                >Siguiente →</button>
                            </div>
                        </div>

                    </div>
                </div>

            </div>

        </main>
    </div>

</div>

<!-- MODAL EXPORTAR ASISTENCIA -->
<div class="modal fade" id="exportAttendanceModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <!-- HEADER -->
            <div class="modal-header">
                <h5 class="modal-title">
                    Exportar asistencias
                </h5>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>
            </div>
            <!-- BODY -->
            <div class="modal-body">
                    <!-- Alert -->
                    <div id="exportAlert" class="alert d-none" role="alert"></div>
                <!-- usuario -->
                <input type="hidden" id="exportUserId">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label">
                            Fecha inicio
                        </label>
                        <input type="date"
                            class="form-control"
                            id="exportStartDate">
                    </div>
                    <div class="col-12">
                        <label class="form-label">
                            Fecha fin
                        </label>
                        <input type="date"
                            class="form-control"
                            id="exportEndDate">
                    </div>
                </div>
            </div>
            <!-- FOOTER -->
            <div class="modal-footer">
                <button type="button"
                        class="btn btn-outline-secondary"
                        data-bs-dismiss="modal">
                    Cancelar
                </button>
                <button type="button"
                        class="btn btn-primary"
                        id="confirmExportAttendance">
                    Exportar
                </button>
            </div>
        </div>
    </div>
</div>

<!-- MODAL CREATE/UPDATE USER -->
<div class="modal fade" id="modalUser" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">

            <!-- HEADER -->
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">
                    Crear usuario
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>
            </div>

            <!-- BODY -->
            <div class="modal-body p-4">

                <!-- FORM -->
                <form id="userForm" novalidate>

                    <!-- Alert -->
                    <div id="userAlert"
                         class="alert d-none"
                         role="alert">
                    </div>

                    <input type="hidden" id="userId">

                    <!-- NAME -->
                    <div class="row mb-3 align-items-center gx-2">
                        <div class="col-md-3">
                            <label for="name" class="mb-0">
                                Nombres
                            </label>
                        </div>

                        <div class="col-md-9">
                            <input
                                type="text"
                                id="name"
                                name="name"
                                placeholder="Ingresa nombre"
                                autocomplete="off"
                                required>
                        </div>
                    </div>

                    <!-- LAST NAME -->
                    <div class="row mb-3 align-items-center gx-2">
                        <div class="col-md-3">
                            <label for="lastName" class="mb-0">
                                Apellidos
                            </label>
                        </div>

                        <div class="col-md-9">
                            <input
                                type="text"
                                id="lastName"
                                name="lastName"
                                placeholder="Ingresa apellido"
                                autocomplete="off"
                                required>
                        </div>
                    </div>

                    <!-- DNI -->
                    <div class="row mb-3 align-items-center gx-2">
                        <div class="col-md-3">
                            <label for="dni" class="mb-0">
                                DNI
                            </label>
                        </div>

                        <div class="col-md-9">
                            <input
                                type="text"
                                id="dni"
                                name="dni"
                                placeholder="Ingresa DNI"
                                maxlength="8"
                                autocomplete="off"
                                required>
                        </div>
                    </div>

                    <!-- CATEGORY -->
                    <div class="row mb-3 align-items-center gx-2">
                        <div class="col-md-3">
                            <label for="category" class="mb-0">
                                Categoría
                            </label>
                        </div>

                        <div class="col-md-9">
                            <select
                                id="category"
                                name="category"
                                required>

                                <option value="">
                                    Selecciona una categoría
                                </option>
                                <option value="Employee">Trabajador</option>
                                <option value="Intern">Practicante</option>

                            </select>
                        </div>
                    </div>

                    <!-- WORK AREA -->
                    <div class="row mb-3 align-items-center gx-2">
                        <div class="col-md-3">
                            <label for="workArea" class="mb-0">
                                Área de trabajo
                            </label>
                        </div>

                        <div class="col-md-9">
                            <select
                                id="workArea"
                                name="workArea"
                                required>
                            </select>
                        </div>
                    </div>

                    <!-- CODE -->
                    <div class="row mb-3 align-items-center gx-2">
                        <div class="col-md-3">
                            <label for="code" class="mb-0">
                                Código
                            </label>
                        </div>

                        <div class="col-md-9">
                            <input
                                type="text"
                                id="code"
                                name="code"
                                placeholder="Ingresa código de entrada"
                                autocomplete="off"
                                required>
                        </div>
                    </div>

                    <!-- ROLE -->
                    <div class="row mb-2 align-items-center gx-2">
                        <div class="col-md-3">
                            <label for="role" class="mb-0">
                                Rol
                            </label>
                        </div>

                        <div class="col-md-9">
                            <select
                                id="role"
                                name="role"
                                required>

                                <option value="">
                                    Selecciona un rol
                                </option>

                                <option value="admin">
                                    Administrador
                                </option>

                                <option value="user">
                                    Usuario
                                </option>

                            </select>
                        </div>
                    </div>

                </form>
            </div>

            <!-- FOOTER -->
            <div class="modal-footer px-4 py-3">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    Cancelar
                </button>

                <button
                    type="button"
                    class="btn btn-primary"
                    id="saveBtn">
                    Guardar
                </button>

            </div>
        </div>
    </div>
</div>

<script type="module" src="/js/users/ui/user.controller.js"></script>
<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
