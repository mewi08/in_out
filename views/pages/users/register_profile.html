<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Empleado</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/register_profile.style.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Registro</h1>
            <p class="subtitle">Crear tu cuenta en el sistema</p>
        </div>
            <form id="registerForm">
                <div class="alert" id="alert"></div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Nombre</label>
                        <input type="text" id="name" name="name" placeholder="Tu nombre" autocomplete="off" required>
                    </div>

                    <div class="form-group">
                        <label for="lastName">Apellido</label>
                        <input type="text" id="lastName" name="lastName" placeholder="Tu apellido" autocomplete="off" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="code">DNI</label>
                    <input type="text" id="code" name="code" maxlength="8" autocomplete="off" required>
                    <span class="helper-text">
                        Será tu código para registrar tu entrada y salida
                    </span>
                </div>

                <div class="form-group">
                    <label for="category">Categoría</label>
                    <select id="category" name="category" required>
                        <option value="">Selecciona una categoría</option>
                        <option value="Trabajador Planilla">Trabajador planilla</option>
                        <option value="Personal Habitual">Personal habitual</option>
                        <option value="Practicante">Practicante</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>

                <div class="form-group category-extra" id="categoryExtra">
                    <label for="categoryOther">
                        Especifica la categoría</label>
                    <input 
                        type="text" 
                        id="categoryOther" 
                        name="categoryOther"
                        placeholder="Describe tu categoría"
                        maxlength="50"
                        autocomplete="off"
                    >
                </div>

                <div class="form-group">
                    <label for="workArea">Área de trabajo</label>
                    <select id="workArea" name="workArea" required>
                        <option value="">Selecciona un área</option>
                        <option value="Administración">Administración</option>
                        <option value="Recursos Humanos">Recursos Humanos</option>
                        <option value="Restaurante">Restaurante</option>
                        <option value="Marketing">Marketing</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>

                <div class="form-group category-extra" id="workAreaExtra">
                    <label for="workAreaOther">
                        Especifica el área</label>
                    <input 
                        type="text" 
                        id="workAreaOther" 
                        name="workAreaOther"
                        placeholder="Describe el área"
                        maxlength="50"
                        autocomplete="off"
                    >
                </div>

                <!-- BOTONES -->
                <div class="button-group">
                    <button type="button" class="btn-secondary" id="backBtn">
                        Volver
                    </button>

                    <button type="submit" class="btn-primary" id="submitBtn">
                        Registrar
                    </button>
                </div>

            </form>
        </div>
    </div>
    <script type="module" src="/js/users/ui/users_CreateProfile.controller.js"></script>
</body>
</html>
