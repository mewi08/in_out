<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Asistencia</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">

    <!-- css -->
    <link rel="stylesheet" href="/css/theme.css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <!-- HEADER -->
    <div class="text-center mb-4">
        <h1 class="fw-bold" style="font-family: var(--font-display);">Asistencia</h1>
        <p class="text-muted" id="subtitle"></p>

        <div class="d-flex justify-content-center gap-2 mt-2">
            <span class="badge rounded-pill bg-primary step-dot active">1</span>
            <span class="badge rounded-pill bg-secondary step-dot">2</span>
        </div>
    </div>

    <!-- CARD PRINCIPAL -->
    <div class="card shadow-sm border-0 mx-auto" style="max-width: 500px; border-radius: 12px;">
        <div class="card-body p-4">
            <!-- ALERT -->
            <div id="alert" class="alert d-none" role="alert"></div>

            <!-- STEP 1 -->
            <div class="step active" id="step-1">
                <div class="mb-3">
                    <label class="form-label">Ingresa tu código</label>
                    <input
                        type="text"
                        id="codeInput"
                        maxlength="3"
                        class="form-control"
                        autocomplete="off"
                    >
                </div>

                <div class="d-grid gap-2">
                    <button type="button" class="btn btn-primary" id="validateCodeBtn">
                        Continuar
                    </button>
                    <button type="button" class="btn btn-outline-secondary" id="backBtn">
                        Volver
                    </button>
                </div>
            </div>

            <!-- STEP 2 -->
            <div class="step d-none" id="step-2">
                <div class="card shadow-sm mb-3 border">
                    <div class="card-body">
                        <!-- HEADER EMPLEADO -->
                        <div class="d-flex align-items-center gap-3 mb-3">
                            <div id="avatarInitials"
                                class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center"
                                style="width:48px;height:48px;font-weight:600;">
                            </div>
                            <div>
                                <h6 class="mb-0 fw-bold" id="employeeName"></h6>
                                <small class="text-muted" id="employeeCategory"></small>
                            </div>
                        </div>
                        <hr>
                        <!-- DETALLES -->
                        <div class="row">
                            <div class="col-6">
                                <div class="text-muted small">DNI</div>
                                <div class="fw-semibold" id="employeeDni"></div>
                            </div>
                            <div class="col-6">
                                <div class="text-muted small">Área de trabajo</div>
                                <div class="fw-semibold" id="employeeWorkArea"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <p class="text-muted small mb-3">
                    Verifica tus datos
                </p>
                <div class="d-grid gap-2">
                    <button type="button" class="btn btn-success" id="confirmBtn">
                        Confirmar
                    </button>
                    <button type="button" class="btn btn-outline-secondary" id="changeCodeBtn">
                        Regresar
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>

<script type="module" src="/js/attendance/ui/attendance.controller.js"></script>

</body>
</html>
