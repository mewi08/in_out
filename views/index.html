<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/index.style.css">
    
</head>
<body>
    <div class="layout">
        <div id="sidebar-container"></div>
        <div class="container">
            <div class="header">
                <h1 class="title">Asistencia</h1>
                <p class="subtitle">Sistema de entrada y salida</p>
            </div>
            
            <div class="clock-card">
                <div class="time-display" id="time">14:35:47</div>
                <div class="date-display" id="date">Lunes, 6 de abril de 2025</div>
            </div>

            <div class="actions-grid">
                <div class="action-card primary" id="checkInBtn">
                    <h2 class="action-title">Entrada</h2>
                    <p class="action-description">Marca tu entrada</p>
                </div>
                
                <div class="action-card primary" id="checkOutBtn">
                    <h2 class="action-title">Salida</h2>
                    <p class="action-description">Marca tu salida</p>
                </div>
            </div>
        </div> 
    </div>       
    <script type="module" src="./js/main.js"></script>
</body>
</html>
