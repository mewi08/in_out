<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">

    <!-- css -->
    <link rel="stylesheet" href="/css/index.style.css">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/sidebar.style.css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- ajuste importante para sticky navbar -->
    <style>
        .main-area {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
    </style>

</head>

<body>

<div class="layout">

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- MAIN AREA -->
    <div class="main-area">

        <!-- NAVBAR (BOOTSTRAP STICKY) -->
        <nav class="navbar navbar-light bg-white border-bottom shadow-sm px-4 py-2 sticky-top">

            <div class="container-fluid">

                <!-- Título -->
                <span class="navbar-brand mb-0 h1 fs-5 fw-semibold text-dark">
                    Control de Asistencia
                </span>

            </div>
        </nav>

        <!-- CONTENIDO -->
        <main class="content">

            <div class="clock-card">
                <div class="time-display" id="time">14:35:47</div>
                <div class="date-display" id="date">Lunes, 6 de abril de 2025</div>
            </div>

            <div class="row justify-content-center g-2">
                <div class="col-md-5">
                    <div class="action-card primary" id="checkInBtn">
                        <h2 class="action-title">Entrada</h2>
                        <p class="action-description">Marca tu entrada</p>
                    </div>
                </div>

                <div class="col-md-5">
                    <div class="action-card primary" id="checkOutBtn">
                        <h2 class="action-title">Salida</h2>
                        <p class="action-description">Marca tu salida</p>
                    </div>
                </div>
            </div>

        </main>

    </div>

</div>

<script type="module" src="./js/main.js"></script>
<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>

</body>
</html>
