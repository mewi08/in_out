<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin. — Ingreso</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/sidebar.style.css">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

</head>
<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="col-12 col-sm-10 col-md-6 col-lg-4">
        
        <div class="card shadow p-4">
            
            <div class="text-center mb-4 form-header">
                <div class="icon mb-2">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
                        <path d="M6.376 18.91a6 6 0 0 1 11.249.003"/>
                        <circle cx="12" cy="11" r="4"/>
                    </svg>
                </div>
                <p class="text-muted mb-1">Bienvenido</p>
                <h2 class="fw-bold">Ingresa a tu cuenta</h2>
            </div>

            <!-- Alert -->
            <div id="alert" class="alert d-none" role="alert"></div>

            <form id="loginForm" novalidate>

                <div class="mb-3">
                    <input 
                        type="text" 
                        id="code" 
                        name="code" 
                        class="form-control" 
                        placeholder="tu.código"
                        autocomplete="off"
                    >
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        Ingresar
                    </button>
                    <button type="button" class="btn btn-outline-secondary" id="backBtn">
                        Cancelar
                    </button>
                </div>

            </form>

        </div>

    </div>
</div>

<script type="module" src="/js/auth/ui/auth.controller.js"></script>
</body>
</html>
