<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">

    <!-- css -->
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/sidebar.style.css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="layout">
<!-- Sidebar -->
<div id="sidebar-container"></div>

<div class="main-area">
    <!-- NAVBAR (BOOTSTRAP STICKY) -->
    <nav class="navbar navbar-light bg-white border-bottom shadow-sm px-4 py-2 sticky-top">

        <div class="container-fluid">

            <!-- TITLE -->
            <span class="navbar-brand mb-0 h1 fs-5 fw-semibold text-dark">
                Panel de Administración
            </span>

        </div>
    </nav>
    <!-- CONTENT -->
    <main class="dashboard flex-grow-1 p-4">

        <div class="container-fluid">
            <!-- KPIs -->
            <section class="row g-3 mb-4">
                <div class="col-6 col-md-4 col-lg">
                    <div class="card shadow-sm h-100">
                        <div class="card-body">
                            <p class="text-muted small mb-1">Total usuarios</p>
                            <h4 id="statTotal" class="fw-bold">—</h4>
                        </div>
                    </div>
                </div>

                <div class="col-6 col-md-6 col-lg">
                    <div class="card shadow-sm h-100">
                        <div class="card-body">
                            <p class="text-muted small mb-1">Activos</p>
                            <h4 id="statActive" class="fw-bold">—</h4>
                        </div>
                    </div>
                </div>

                <div class="col-6 col-md-6 col-lg">
                    <div class="card shadow-sm h-100">
                        <div class="card-body">
                            <p class="text-muted small mb-1">Inactivos</p>
                            <h4 id="statInactive" class="fw-bold">—</h4>
                        </div>
                    </div>
                </div>

                <div class="col-6 col-md-4 col-lg">
                    <div class="card shadow-sm h-100">
                        <div class="card-body">
                            <p class="text-muted small mb-1">Administradores</p>
                            <h4 id="statAdmin" class="fw-bold">—</h4>
                        </div>
                    </div>
                </div>

                <div class="col-6 col-md-4 col-lg">
                    <div class="card shadow-sm h-100">
                        <div class="card-body">
                            <p class="text-muted small mb-1">Usuarios</p>
                            <h4 id="statUser" class="fw-bold">—</h4>
                        </div>
                    </div>
                </div>
            </section>

            <!-- ACTIONS -->
            <section class="mb-4 d-flex gap-2 flex-wrap">
                <button type="button" class="btn btn-primary" id="btnUser">
                    Gestionar Usuarios
                </button>

                <button type="button" class="btn btn-outline-primary" id="btnAttendance">
                    Gestionar Asistencias
                </button>

                <button type="button" class="btn btn-outline-primary" id="btnAreas">
                    Gestionar Áreas
                </button>
            </section>

            <!-- ACTIVITIES -->
            <section>
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="fw-bold mb-3">Actividad reciente</h5>

                        <div id="recentActivity" class="text-muted">
                            Cargando...
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
</div>
</div>

<script type="module" src="/js/admin/ui/dashboard.controller.js"></script>

</body>
</html>
